name: coco-ci-build
on:
  pull_request:
    branches:
      - main
      - chime-upgrade
  push:
    branches:
      - main
      - chime-upgrade

jobs:
  ruff_format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install ruff
        run: pip install ruff

      - name: Run ruff format
        run: ruff format --check .

  ruff_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check .

  tests:
    runs-on: ubuntu-latest
    env:
      COCO_TEST_REDIS_PORT: 6379
    strategy:
      matrix:
        python_version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}

      - name: Install pip dependencies
        run: pip install .[cocod,test]

      - name: Start Redis
        uses: supercharge/redis-github-action@1.8.1
        with:
          redis-version: 7

      - name: Run unit tests
        run: pytest -v tests
